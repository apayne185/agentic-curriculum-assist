name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # A build-time placeholder is enough for `next build` to compile
          # the routes that reference it; real requests still need a real
          # key set in the deployment environment.
          ANTHROPIC_API_KEY: build-placeholder-key
